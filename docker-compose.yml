services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: battles_and_barmaids
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres  # local development only
    volumes:
      - db-data:/var/lib/postgresql/data
      # Runs on first start only.
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      # Avoids local Postgres (5432) and pgAdmin (5433).
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d battles_and_barmaids"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/battles_and_barmaids
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    # The slim image has no curl.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
