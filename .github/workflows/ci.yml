# Runs the tests and checks that the Docker stack starts and answers.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        # Same port as Compose, so the tests' default TEST_DATABASE_URL works.
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"  # matches the Dockerfile
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # --wait returns once the db and web healthchecks pass.
      - run: docker compose up --build --detach --wait --wait-timeout 120
      - run: curl --fail --silent http://localhost:5000/health
      - run: curl --fail --silent http://localhost:5000/quests/1
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - run: docker compose down --volumes
        if: always()
